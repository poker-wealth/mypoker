# Netlify hosts the MYPOKER Mini App as a STATIC SPA. There are no serverless
# functions — none, deliberately.
#
# The app is a static bundle that talks only to the game-server gateway (auth,
# lobby, jackpot, live tables) — the documented architecture in
# docs/handoff/02-architecture.md. Point the frontend at the gateway by setting
# VITE_API_URL (and VITE_TABLES_URL / VITE_TABLES_WS_URL for the socket) in the
# Netlify build environment. Nothing is served same-origin by Netlify except the
# static files themselves.

[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

# SPA fallback — every route serves index.html; React Router takes it from there.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Allow embedding inside the Telegram in-app browser + basic hardening.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

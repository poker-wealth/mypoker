<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0d0d1a" />
    <link rel="icon" type="image/png" href="/brand/logo-icon.png" />
    <title>MYPOKER — Fair. On-Chain. Always.</title>
    <!-- Google Fonts: Nunito, Lora, Inter, Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />

    <!-- Telegram Mini App runtime; harmless in a plain browser -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Start fetching the splash mark immediately, in parallel with the bundle. -->
    <link rel="preload" as="image" href="/brand/splash-mark.png" />

    <!--
      Boot screen.

      This lives in the HTML, inline, on purpose. A splash rendered by React
      cannot remove the white flash it exists to hide — nothing paints until the
      bundle has downloaded, parsed and mounted, and that gap is exactly the
      problem. Markup here paints on the browser's first frame.

      The styles are inline for the same reason: the stylesheet is a separate
      request, and if it lands late the page would flash white before it applies.
      Everything below is therefore duplicated from index.css rather than shared.
      If the brand colours change, this block changes too.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        background: #0d0d1a;
        opacity: 1;
        transition: opacity 320ms ease-out;
      }
      /* Added by dismissSplash() once the app has painted its first frame. */
      #splash.is-dismissed {
        opacity: 0;
        pointer-events: none;
      }
      /* Entrance on the wrapper, spin on the image: both animate `transform`,
         so they must live on different elements or one overrides the other. */
      #splash-mark-wrap {
        perspective: 900px;
        animation: splash-in 520ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      #splash-mark {
        width: min(50vw, 220px);
        height: auto;
        filter: drop-shadow(0 0 28px rgb(187 92 246 / 0.45));
        animation: splash-turn 3.4s linear infinite;
      }
      @keyframes splash-in {
        from { opacity: 0; transform: scale(0.94); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-turn {
        from { transform: rotateY(0deg); }
        to   { transform: rotateY(360deg); }
      }
      /* Honour the OS setting: show the same screen, just hold it still. */
      @media (prefers-reduced-motion: reduce) {
        #splash { transition-duration: 1ms; }
        #splash-mark-wrap { animation: none; }
        #splash-mark { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-mark-wrap">
        <img
          id="splash-mark"
          src="/brand/splash-mark.png"
          alt="MYPOKER"
          onerror="this.onerror=null;this.src='/brand/logo-mark.png'"
        />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

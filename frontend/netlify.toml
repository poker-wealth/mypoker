# Netlify deploy config for the FairPlay Mini App.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA fallback — every route serves index.html (React Router handles the rest).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Allow embedding inside the Telegram in-app browser.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# FairPlay — persistent local dev stack.
# Optional: tests run against mongodb-memory-server with no install. Use this when you want a
# durable local MongoDB replica set + Redis (closer to production).
#
#   docker compose up -d
#   # one-time: initialise the single-node replica set (transactions require RS)
#   docker compose exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
#
# Then set in financial-core/.env:
#   MONGO_URI=mongodb://localhost:27017/fairplay_fc?replicaSet=rs0
#   REDIS_URL=redis://localhost:6379

services:
  mongo:
    image: mongo:7
    container_name: fairplay-mongo
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fairplay-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  redis-data:
